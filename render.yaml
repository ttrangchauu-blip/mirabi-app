# Render Blueprint for the test backend (docs/deploy-test.md). The service builds the root Dockerfile.
# Values marked `sync: false` are asked for once when the Blueprint is created; they never live in git.
# Render only asks for them on services, not in environment groups, so every variable lives on the service.
services:
  - type: web
    name: mirabi-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL  # Neon connection string, postgresql://...?sslmode=require
        sync: false
      # Render's edge already redirects HTTP to HTTPS; the app's own redirect would answer the internal
      # plain-HTTP health check with 307.
      - key: FORCE_HTTPS
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_BACKEND
        value: disabled
      - key: ADMIN_EMAILS
        sync: false
